# AgentBox MCP Server — browser tool over Streamable HTTP
# Local Docker only. No Docker socket, no external network.

services:
  agentbox:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentbox

    ports:
      - "${AGENTBOX_PORT:-8054}:8000"

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 200

    volumes:
      - agentbox-screenshots:/workspace/screenshots

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  agentbox-screenshots:
