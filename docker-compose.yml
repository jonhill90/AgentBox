# AgentBox MCP Server — browser tool over Streamable HTTP
# Local Docker only. No Docker socket, no external network.

services:
  agentbox:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentbox

    ports:
      # Bound to loopback, not 0.0.0.0. Docker's docs: "Publishing
      # container ports is insecure by default... the Docker daemon
      # publishes ports to all host addresses". On Linux this also
      # bypasses ufw (nat table, before INPUT), so the bind address is
      # the control, not the host firewall. Override AGENTBOX_BIND to
      # expose deliberately.
      - "${AGENTBOX_BIND:-127.0.0.1}:${AGENTBOX_PORT:-8054}:8000"

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Feature toggle (SPEC §10). On for local dev, stated explicitly
      # here so the fact lives in deployment config rather than in code.
      # Off means the filesystem, git and http_request tools are never
      # registered with FastMCP at all. Any future non-local profile
      # must default this to false as its own reviewed decision.
      - AGENTBOX_ENABLE_JUMPBOX_TOOLS=${AGENTBOX_ENABLE_JUMPBOX_TOOLS:-true}
      # Local auth (SPEC §12). Empty/unset = no auth, today's default.
      # Set it and every MCP tool and /api/* route needs
      # `Authorization: Bearer <token>`; /health stays open.
      - AGENTBOX_AUTH_TOKEN=${AGENTBOX_AUTH_TOKEN:-}
      # Preferred over the variable above: point at a file (e.g. a Compose
      # secret at /run/secrets/...) so the value never appears in
      # `docker inspect`. Set one or the other, not both.
      - AGENTBOX_AUTH_TOKEN_FILE=${AGENTBOX_AUTH_TOKEN_FILE:-}
      # Set to the outgoing token during a rotation; both are accepted
      # while both are set. Clear it when every client has moved.
      - AGENTBOX_AUTH_TOKEN_PREVIOUS=${AGENTBOX_AUTH_TOKEN_PREVIOUS:-}
      # Terminal (SPEC §15). Its own flag, and the only one that defaults
      # OFF — it is a shell, not a structured tool. Requires
      # AGENTBOX_AUTH_TOKEN as well: the WebSocket is fail-closed and
      # refuses every connection with 4001 when no token is configured.
      - AGENTBOX_ENABLE_TERMINAL=${AGENTBOX_ENABLE_TERMINAL:-false}

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 200

    volumes:
      # The workspace the filesystem and git tools are scoped to (SPEC §8).
      # Named volume so written files survive `docker compose down`.
      - agentbox-workspace:/workspace
      - agentbox-screenshots:/workspace/screenshots

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  agentbox-workspace:
  agentbox-screenshots:
