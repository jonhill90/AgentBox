<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBox — Browser Viewer</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<style>
  /* Powerline/icon glyphs for the tmux Tokyo Night status bar. A 944-byte
     subset of the Nerd Font symbols — see src/vendor/README.md. Listed
     FIRST in the terminal's font stack so it wins for those codepoints
     and the normal mono font handles everything else. */
  @font-face {
    font-family: "NerdSymbols";
    src: url("/vendor/nerd-symbols.woff2") format("woff2");
    font-display: block;
  }
  :root {
    --bg: #0b1120; --panel: #111a2e; --border: #1e2b45; --text: #e6edf7;
    --muted: #8296b3; --accent: #d97706; --accent-dim: #78350f; --link: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Tab strip. Views are full-height and mutually exclusive — the
     terminal used to take a fixed 40% and squash the browser. */
  #tabs {
    display: flex; align-items: stretch; gap: 2px; padding: 6px 10px 0;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 15px; border: 1px solid transparent; border-bottom: none;
    border-radius: 7px 7px 0 0; margin-bottom: -1px;
    color: var(--muted); background: transparent; cursor: pointer;
    font: inherit; font-weight: 500;
  }
  .tab:hover { color: var(--text); background: #16203a; }
  .tab.active {
    color: var(--text); background: var(--bg);
    border-color: var(--border); border-bottom: 1px solid var(--bg);
  }
  .tab .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #3d4a66; flex: 0 0 auto;
  }
  .tab .dot.live { background: #9ece6a; }
  .tab .dot.busy { background: var(--accent); }
  #tabspacer { flex: 1; }
  #tabmeta { display: flex; align-items: center; color: var(--muted); font-size: 11.5px; padding-right: 4px; }
  header {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header[hidden] { display: none; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  button {
    font: inherit; color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; cursor: pointer;
  }
  button:hover { color: var(--text); background: #1a2540; }
  button.nav { padding: 4px 8px; font-size: 14px; line-height: 1; }
  #control.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #url {
    flex: 1; min-width: 0; font: inherit; color: var(--text);
    background: #0a1020; border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px;
  }
  #url:focus { outline: none; border-color: var(--link); }
  #stage {
    flex: 1; min-height: 0; overflow: auto; padding: 10px;
    display: flex; align-items: flex-start; justify-content: center; outline: none;
  }
  #stage.armed { box-shadow: inset 0 0 0 2px rgba(217, 119, 6, .45); }
  #shot {
    max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px;
    display: block; background: #000;
  }
  #shot.armed { cursor: crosshair; }
  #describe { display: none; }
  #describe.shown { display: inline-block; }
  #describe.on { background: var(--link); border-color: var(--link); color: #04202e; }
  /* [hidden] must beat display:inline-block — the UA stylesheet's
     display:none loses to an author-level rule, which left an empty
     image box next to the "Browser not active" placeholder. */
  #frame { position: relative; display: inline-block; }
  #frame[hidden] { display: none; }
  #popover {
    position: absolute; z-index: 20; width: 300px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 12px;
  }
  #popover .tag { color: var(--link); font-family: ui-monospace, SFMono-Regular, monospace; }
  #popover .muted { color: var(--muted); }
  #popover .row { margin-top: 5px; word-break: break-all; }
  #popover .txt { font-style: italic; }
  #popover .close {
    float: right; cursor: pointer; color: var(--muted); border: none;
    background: none; padding: 0 0 0 8px; font-size: 14px; line-height: 1;
  }
  #highlight {
    position: absolute; pointer-events: none; border: 2px solid var(--link);
    background: rgba(56, 189, 248, .12); border-radius: 3px;
  }
  #placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 380px; }
  #placeholder h2 { font-size: 15px; color: var(--text); margin: 0 0 6px; font-weight: 600; }
  #placeholder p { margin: 4px 0; }
  code { background: #0a1020; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  footer {
    flex: 0 0 auto; display: flex; gap: 14px; padding: 5px 10px; color: var(--muted);
    background: var(--panel); border-top: 1px solid var(--border); font-size: 11.5px;
  }
  #status.err { color: #f87171; }
  /* ── terminal view (SPEC §15.5) ── */
  #termview { background: #1a1b26; }
  #termbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border); font-size: 11.5px;
    flex: 0 0 auto; }
  #termbar .grow { flex: 1; }
  #termstate { color: var(--muted); }
  #termctl.on { background: #f7768e; border-color: #f7768e; color: #1a1b26; }
  #termhost { flex: 1; min-height: 0; padding: 6px 8px; overflow: hidden; }
  #tab-terminal[hidden] { display: none; }
  /* xterm ships a default (light) scrollbar that looks wrong on a dark
     terminal — it rendered as a white strip down the right edge. */
  .xterm-viewport { scrollbar-width: thin; scrollbar-color: #292e42 #1a1b26; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-track { background: #1a1b26; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #292e42; border-radius: 5px; }
  .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #3d4a66; }
  /* Footer swaps content with the tab, so it never describes the view
     you are not looking at. */
  .browser-only[hidden], .terminal-only[hidden] { display: none; }
  #hint { margin-left: auto; }
</style>
</head>
<body>

<nav id="tabs">
  <button class="tab active" id="tab-browser"><span class="dot" id="dot-browser"></span>Browser</button>
  <button class="tab" id="tab-terminal" hidden><span class="dot" id="dot-terminal"></span>Terminal</button>
  <span id="tabspacer"></span>
  <span id="tabmeta"></span>
</nav>

<div class="view" id="view-browser">
<header>
  <button class="nav" id="back" title="Back">&#8592;</button>
  <button class="nav" id="forward" title="Forward">&#8594;</button>
  <button class="nav" id="reload" title="Reload">&#8635;</button>
  <input id="url" type="text" placeholder="Enter URL and press Enter..." spellcheck="false" autocomplete="off">
  <button id="describe" title="When on, clicking an element describes it instead of clicking the page">Describe</button>
  <button id="control" title="When on, clicks / scrolls / keystrokes go to the real page">Take Control</button>
</header>

<div id="stage" tabindex="-1">
  <div id="frame" hidden>
    <img id="shot" alt="Live browser screenshot">
  </div>
  <div id="placeholder">
    <h2>Browser not active</h2>
    <p>The page starts on the first tool call or navigation.</p>
    <p>Type a URL above, or have an agent call <code>navigate</code> over MCP.</p>
  </div>
</div>
</div><!-- /view-browser -->

<div class="view" id="termview" hidden>
  <div id="termbar">
    <span id="termstate">Disconnected</span>
    <span class="grow"></span>
    <button id="termctl" title="When on, keystrokes go to the shell">Take Control</button>
  </div>
  <div id="termhost"></div>
</div>

<footer>
  <span id="status" class="browser-only">Connecting&hellip;</span>
  <span id="current" class="browser-only"></span>
  <span id="hint" class="browser-only">Take Control off &mdash; view only</span>
  <span id="termfoot" class="terminal-only" hidden>Shell in /workspace</span>
  <span id="termhint" class="terminal-only" hidden style="margin-left:auto">
    Take Control off &mdash; read only
  </span>
</footer>

<script>
"use strict";
// Mirrors Hill90 services/ui/src/app/chat/SessionPane.tsx BrowserView,
// minus React: poll the screenshot, drive the chrome bar, and forward
// clicks / scrolls / keystrokes when Take Control is on.
const POLL_MS = 2000;
const SCROLL_DEBOUNCE_MS = 100;

const VIEWPORT_W = 1280, VIEWPORT_H = 720;   // matches the context in mcp_server.py

const els = {
  shot: document.getElementById("shot"),
  frame: document.getElementById("frame"),
  placeholder: document.getElementById("placeholder"),
  stage: document.getElementById("stage"),
  url: document.getElementById("url"),
  control: document.getElementById("control"),
  describe: document.getElementById("describe"),
  status: document.getElementById("status"),
  current: document.getElementById("current"),
  hint: document.getElementById("hint"),
};

let takeControl = false;
let describeMode = false;
let inFlight = false;              // don't stack polls if one is slow
const scrollAcc = { x: 0, y: 0 };
let scrollTimer = null;

function setStatus(text, isError) {
  els.status.textContent = text;
  els.status.classList.toggle("err", !!isError);
}

// ── auth (SPEC §12) ─────────────────────────────────────────────────
// If the server reports auth is on, ask for the token once and keep it
// in sessionStorage — never per request. A 401 clears it and re-prompts,
// so a wrong paste is recoverable without a reload.
const TOKEN_KEY = "agentbox-token";
let authRequired = false;
let termEnabled = false;

function storedToken() {
  return sessionStorage.getItem(TOKEN_KEY) || "";
}

function promptForToken(message) {
  const entered = window.prompt(message || "AgentBox auth token:", "");
  if (entered) sessionStorage.setItem(TOKEN_KEY, entered.trim());
  else sessionStorage.removeItem(TOKEN_KEY);
  return storedToken();
}

async function initAuth() {
  try {
    const res = await fetch("/api/auth-required", { cache: "no-store" });
    const info = res.ok ? await res.json() : {};
    authRequired = info.auth_required === true;
    termEnabled = info.terminal_enabled === true;
  } catch {
    authRequired = false;
    termEnabled = false;
  }
  if (authRequired && !storedToken()) {
    promptForToken("This AgentBox requires an auth token (AGENTBOX_AUTH_TOKEN):");
  }
}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  const token = storedToken();
  if (authRequired && token) headers["Authorization"] = "Bearer " + token;
  return headers;
}

function handleUnauthorized() {
  setStatus("Unauthorized — check the token", true);
  sessionStorage.removeItem(TOKEN_KEY);
  promptForToken("Token rejected. AgentBox auth token:");
}

async function post(path, body) {
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body),
    });
    if (res.status === 401) { handleUnauthorized(); return null; }
    const data = await res.json().catch(() => ({}));
    if (data && data.success === false && data.error) setStatus(data.error, true);
    return data;
  } catch (err) {
    setStatus("Request failed: " + err.message, true);
    return null;
  }
}

async function refresh() {
  if (inFlight) return;
  inFlight = true;
  try {
    const res = await fetch("/api/screenshot", { cache: "no-store", headers: authHeaders() });
    if (res.status === 401) { handleUnauthorized(); return; }
    if (res.status === 404) {
      els.frame.hidden = true;
      els.placeholder.hidden = false;
      setStatus("Browser not active");
      tabEls.browserDot.classList.remove("live");
      els.current.textContent = "";
      return;
    }
    if (!res.ok) { setStatus("Screenshot failed (" + res.status + ")", true); return; }

    const data = await res.json();
    if (!data.screenshot) { setStatus(data.error || "No screenshot available", true); return; }

    els.shot.src = "data:image/png;base64," + data.screenshot;
    els.frame.hidden = false;
    els.placeholder.hidden = true;
    els.current.textContent = data.url || "";
    // Don't fight the operator while they're editing the URL bar.
    if (document.activeElement !== els.url) els.url.value = data.url || "";
    setStatus("Live · " + Math.round((data.bytes || 0) / 1024) + " KB");
    tabEls.browserDot.classList.add("live");
  } catch (err) {
    setStatus("Failed to fetch screenshot", true);
  } finally {
    inFlight = false;
  }
}

// ── chrome bar ──────────────────────────────────────────────────────
async function navigate() {
  const target = els.url.value.trim();
  if (!target) return;
  const finalUrl = /^[a-z][a-z0-9+.-]*:/i.test(target) ? target : "https://" + target;
  setStatus("Navigating…");
  await post("/api/browser/navigate", { url: finalUrl });
  await refresh();
}

async function history(action) {
  await post("/api/browser/history", { action: action });
  await refresh();
}

els.url.addEventListener("keydown", (e) => { if (e.key === "Enter") navigate(); });
document.getElementById("back").addEventListener("click", () => history("back"));
document.getElementById("forward").addEventListener("click", () => history("forward"));
document.getElementById("reload").addEventListener("click", () => history("reload"));

// ── take control ────────────────────────────────────────────────────
function updateHint() {
  els.hint.textContent = !takeControl
    ? "Take Control off — view only"
    : describeMode
      ? "Describe on — clicking inspects an element instead of clicking it"
      : "Click, scroll, and type go to the page";
}

function setTakeControl(on) {
  takeControl = on;
  els.control.classList.toggle("on", on);
  els.control.textContent = on ? "Take Control: ON" : "Take Control";
  els.shot.classList.toggle("armed", on);
  els.stage.classList.toggle("armed", on);
  els.stage.tabIndex = on ? 0 : -1;
  // Describe only exists while you have control (matches Hill90's UI).
  els.describe.classList.toggle("shown", on);
  if (!on) setDescribe(false);
  updateHint();
  if (on) els.stage.focus();
}

function setDescribe(on) {
  describeMode = on;
  els.describe.classList.toggle("on", on);
  els.describe.textContent = on ? "Describe: ON" : "Describe";
  if (!on) clearPopover();
  updateHint();
}

els.control.addEventListener("click", () => setTakeControl(!takeControl));
els.describe.addEventListener("click", () => setDescribe(!describeMode));

// ── describe popover ────────────────────────────────────────────────
function clearPopover() {
  const old = document.getElementById("popover");
  if (old) old.remove();
  const hl = document.getElementById("highlight");
  if (hl) hl.remove();
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function showPopover(el, atX, atY) {
  clearPopover();
  if (!el) { setStatus("No element at that point", true); return; }

  if (el.box && el.box.w > 0) {
    const hl = document.createElement("div");
    hl.id = "highlight";
    hl.style.left = (el.box.x / VIEWPORT_W) * 100 + "%";
    hl.style.top = (el.box.y / VIEWPORT_H) * 100 + "%";
    hl.style.width = (el.box.w / VIEWPORT_W) * 100 + "%";
    hl.style.height = (el.box.h / VIEWPORT_H) * 100 + "%";
    els.frame.appendChild(hl);
  }

  const classes = (el.classes || []).length ? "." + el.classes.slice(0, 3).join(".") : "";
  const pop = document.createElement("div");
  pop.id = "popover";
  pop.innerHTML =
    '<button class="close" title="Close">&times;</button>' +
    '<span class="tag">&lt;' + esc(el.tag) + "&gt;</span>" +
    (el.id ? ' <span class="muted">#' + esc(el.id) + "</span>" : "") +
    (classes ? ' <span class="muted">' + esc(classes) + "</span>" : "") +
    (el.text ? '<div class="row txt">"' + esc(el.text.slice(0, 120)) + '"</div>' : "") +
    '<div class="row muted">selector: <code>' + esc(el.selector || "") + "</code></div>";
  pop.style.left = Math.min(atX, els.shot.clientWidth - 310) + "px";
  pop.style.top = (atY > els.shot.clientHeight / 2 ? atY - 130 : atY + 18) + "px";
  pop.querySelector(".close").addEventListener("click", clearPopover);
  els.frame.appendChild(pop);
  setStatus("Described <" + el.tag + ">");
}

els.shot.addEventListener("click", async (e) => {
  if (!takeControl) return;
  const rect = els.shot.getBoundingClientRect();
  const xPct = Math.round(((e.clientX - rect.left) / rect.width) * 10000) / 100;
  const yPct = Math.round(((e.clientY - rect.top) / rect.height) * 10000) / 100;

  if (describeMode) {
    // Inspect the element instead of clicking it — the page is untouched.
    const data = await post("/api/browser/element", { x_percent: xPct, y_percent: yPct });
    if (data && data.success) showPopover(data.element, e.clientX - rect.left, e.clientY - rect.top);
    return;
  }

  clearPopover();
  els.stage.focus();  // so keystrokes land here next
  await post("/api/browser/click", { x_percent: xPct, y_percent: yPct });
  await refresh();
});

// Wheel fires very fast — accumulate deltas and send one scroll.
els.shot.addEventListener("wheel", (e) => {
  if (!takeControl) return;
  e.preventDefault();
  scrollAcc.x += e.deltaX;
  scrollAcc.y += e.deltaY;
  if (scrollTimer) clearTimeout(scrollTimer);
  scrollTimer = setTimeout(async () => {
    const dx = scrollAcc.x, dy = scrollAcc.y;
    scrollAcc.x = 0; scrollAcc.y = 0;
    scrollTimer = null;
    await post("/api/browser/scroll", { delta_x: dx, delta_y: dy });
    await refresh();
  }, SCROLL_DEBOUNCE_MS);
}, { passive: false });

const SPECIAL_KEYS = new Set([
  "Enter", "Tab", "Escape", "Backspace", "Delete",
  "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
  "Home", "End", "PageUp", "PageDown",
]);

els.stage.addEventListener("keydown", async (e) => {
  if (!takeControl || describeMode) return;   // Describe never types into the page
  // Never steal keystrokes aimed at the URL bar.
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  if (SPECIAL_KEYS.has(e.key)) {
    e.preventDefault();
    await post("/api/browser/keypress", { key: e.key });
    await refresh();
  } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    await post("/api/browser/type", { text: e.key });
    await refresh();
  }
});

// ── terminal panel (SPEC §15.5) ─────────────────────────────────────
// Mirrors XTerminal.tsx's model without React: Observing by default,
// Take Control enables stdin. Binary frames carry terminal I/O, JSON
// text frames carry control.
const TERM_PING_MS = 30000;
const TERM_MAX_RECONNECTS = 5;

const term = {
  enabled: false, open: false, controlling: false, openedOnce: false,
  xterm: null, fit: null, ws: null, ping: null, reconnects: 0, dataSub: null,
};

const termEls = {
  view: document.getElementById("termview"),
  host: document.getElementById("termhost"),
  ctl: document.getElementById("termctl"),
  state: document.getElementById("termstate"),
  dot: document.getElementById("dot-terminal"),
};

const tabEls = {
  browser: document.getElementById("tab-browser"),
  terminal: document.getElementById("tab-terminal"),
  browserView: document.getElementById("view-browser"),
  browserDot: document.getElementById("dot-browser"),
  meta: document.getElementById("tabmeta"),
};

let activeTab = "browser";

function setTermState(text, live) {
  termEls.state.textContent = text;
  termEls.dot.classList.toggle("live", live === true);
  termEls.dot.classList.toggle("busy", live === "busy");
}

// ── tabs ────────────────────────────────────────────────────────────
// Each view owns the full pane. The terminal keeps its WebSocket open
// while the browser tab is showing, so switching back does not drop the
// shell session.
function activateTab(name) {
  activeTab = name;
  const isTerm = name === "terminal";

  tabEls.browser.classList.toggle("active", !isTerm);
  tabEls.terminal.classList.toggle("active", isTerm);
  tabEls.browserView.hidden = isTerm;
  termEls.view.hidden = !isTerm;

  document.querySelectorAll(".browser-only").forEach((el) => { el.hidden = isTerm; });
  document.querySelectorAll(".terminal-only").forEach((el) => { el.hidden = !isTerm; });

  if (isTerm) {
    setTakeControl(false);          // browser input off while it is hidden
    if (!term.ws || term.ws.readyState > WebSocket.OPEN) connectTerm();
    // Fit after the pane is actually laid out, or xterm measures zero.
    requestAnimationFrame(() => {
      try { term.fit.fit(); sendTermResize(); term.xterm.focus(); } catch {}
    });
  } else {
    setTermControl(false);          // shell input off while it is hidden
  }
}

tabEls.browser.addEventListener("click", () => activateTab("browser"));
tabEls.terminal.addEventListener("click", () => activateTab("terminal"));

function termWsUrl() {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const token = storedToken();
  return `${scheme}//${location.host}/terminal` + (token ? `?token=${encodeURIComponent(token)}` : "");
}

function sendTermResize() {
  if (!term.fit || !term.ws || term.ws.readyState !== WebSocket.OPEN) return;
  const dims = term.fit.proposeDimensions();
  if (dims && dims.cols && dims.rows) {
    term.ws.send(JSON.stringify({ type: "resize", cols: dims.cols, rows: dims.rows }));
  }
}

function connectTerm() {
  if (!term.xterm) {
    term.xterm = new Terminal({
      cursorBlink: true, disableStdin: true, fontSize: 13, scrollback: 5000,
      convertEol: true, fontFamily: "NerdSymbols, ui-monospace, SFMono-Regular, Menlo, monospace",
      theme: { background: "#1a1b26", foreground: "#a9b1d6", cursor: "#c0caf5" },
    });
    term.fit = new FitAddon.FitAddon();
    term.xterm.loadAddon(term.fit);
    term.xterm.open(termEls.host);
    new ResizeObserver(() => { try { term.fit.fit(); sendTermResize(); } catch {} })
      .observe(termEls.host);
  }
  try { term.fit.fit(); } catch {}

  const ws = new WebSocket(termWsUrl());
  ws.binaryType = "arraybuffer";
  term.ws = ws;
  term.openedOnce = false;
  setTermState("Connecting…", "busy");

  ws.onopen = () => {
    term.reconnects = 0;
    term.openedOnce = true;
    setTermState(term.controlling ? "Controlling" : "Observing", true);
    sendTermResize();
    if (term.ping) clearInterval(term.ping);
    term.ping = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
    }, TERM_PING_MS);
  };

  ws.onmessage = (event) => {
    term.xterm.write(event.data instanceof ArrayBuffer
      ? new Uint8Array(event.data) : event.data);
  };

  ws.onclose = (event) => {
    if (term.ping) { clearInterval(term.ping); term.ping = null; }
    setTermControl(false);
    setTermState("Disconnected", false);

    // 1000 is a clean close. An auth refusal arrives as a FAILED HANDSHAKE
    // (HTTP 403), not close code 4001 — the server rejects before accept,
    // so onclose fires with 1006 and wasClean false. Retrying that just
    // spins, so treat a never-opened socket as terminal.
    if (event.code === 1000 || event.code === 4001) return;
    if (!term.openedOnce) {
      term.xterm.write("\r\n\x1b[31mConnection refused — check AGENTBOX_AUTH_TOKEN " +
                       "and that AGENTBOX_ENABLE_TERMINAL is on.\x1b[0m\r\n");
      return;
    }
    if (term.reconnects < TERM_MAX_RECONNECTS) {
      term.reconnects++;
      setTimeout(() => connectTerm(),
                 Math.min(2000 * term.reconnects, 10000));
    }
  };

}

function setTermControl(on) {
  term.controlling = on && !!term.ws && term.ws.readyState === WebSocket.OPEN;
  termEls.ctl.classList.toggle("on", term.controlling);
  termEls.ctl.textContent = term.controlling ? "Release" : "Take Control";
  document.getElementById("termhint").textContent = term.controlling
    ? "Keystrokes go to the shell"
    : "Take Control off — read only";
  if (!term.xterm) return;

  term.xterm.options.disableStdin = !term.controlling;
  if (term.controlling) {
    term.xterm.focus();
    if (!term.dataSub) {
      term.dataSub = term.xterm.onData((data) => {
        if (term.ws && term.ws.readyState === WebSocket.OPEN) {
          term.ws.send(new TextEncoder().encode(data));
        }
      });
    }
    setTermState("Controlling", true);
  } else {
    if (term.dataSub) { term.dataSub.dispose(); term.dataSub = null; }
    if (term.ws && term.ws.readyState === WebSocket.OPEN) setTermState("Observing", true);
  }
}

termEls.ctl.addEventListener("click", () => setTermControl(!term.controlling));

// ── poll ────────────────────────────────────────────────────────────
setTakeControl(false);
initAuth().then(() => {
  // The terminal tab only appears when the server has the toggle on.
  tabEls.terminal.hidden = !termEnabled;
  if (authRequired) tabEls.meta.textContent = "🔒 authenticated";
  refresh();
  setInterval(refresh, POLL_MS);
});
</script>
</body>
</html>
