# AgentBox tmux config — ported from hill90-app's services/agentbox/theme/tmux.conf,
# which is in turn identical to Jon's dotfiles.
#
# Theme: fabioluciano/tmux-tokyo-night, pinned to fcfde9a (same commit as
# the Mac and as Hill90's agentbox, so the terminal here looks like the
# terminal there).

# General settings
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g history-limit 50000
set -g set-clipboard on
set -g detach-on-destroy off

# Move status bar to top
set -g status-position top

# Enable mouse support
set -g mouse on

# Vim keybinds
setw -g mode-keys vi

# Terminal. xterm.js reports itself as xterm-256color and handles truecolor,
# so the same overrides Hill90 uses apply unchanged.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-tokyo-night'

### Tokyo Night Theme configuration
set -g @theme_variation 'night'
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_disable_plugins '1'

### Enable transparency
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_transparent_status_bar 'true'
set -g @theme_transparent_left_separator_inverse ''
set -g @theme_transparent_right_separator_inverse ''

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
